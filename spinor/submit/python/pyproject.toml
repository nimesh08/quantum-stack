[project]
name = "heisenberg-spinor-submit"
description = "Heisenberg Quantum Stack — provider submission adapters (verbatim mode)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Nimesh Cheedella", email = "chnimesh0808@gmail.com" }]
keywords = ["quantum", "spinor", "ibm", "braket", "azure", "ionq", "quantinuum", "heisenberg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
version = "0.6.0"

dependencies = ["python-dotenv==1.2.4", "PyYAML==6.0.3", "platformdirs==4.12.4"]

[project.scripts]
qstack = "qstack.cli:main"

[project.optional-dependencies]
ibm = ["qiskit==2.5.2", "qiskit-ibm-runtime==0.50.0"]
aws = ["amazon-braket-sdk==1.127.3.post0"]
azure = ["qdk[azure]==1.33.1", "azure-quantum==3.13.0", "azure-identity>=1.19,<2", "pyqir==0.12.6"]
google = ["cirq-google==1.7.0"]
quantinuum = ["qnexus==0.51.1", "pyqir==0.12.6"]
rigetti = ["qcs-sdk-python==0.30.0"]
iqm = ["iqm-client==35.0.3"]
oqc = ["oqc-qcaas-client==3.23.0; python_version == '3.12'"]
aqt = ["aqt-connector==0.4"]
qir = ["pyqir==0.12.6"]
keyring = ["keyring==25.7.0"]
qibolab = ["qibolab==0.2.17"]
test = ["pytest>=9.0", "numpy==2.5.3"]
verify = ["numpy==2.5.3", "pyqir==0.12.6"]

[project.urls]
Homepage = "https://nimesh08.github.io/quantum-stack/"
Repository = "https://github.com/nimesh08/quantum-stack"
Documentation = "https://nimesh08.github.io/quantum-stack/"
Issues = "https://github.com/nimesh08/quantum-stack/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spinor_submit*", "qstack*"]

[tool.setuptools.package-data]
spinor_submit = ["cassettes/*/*.json"]
qstack = ["data/registry/chips/*.yaml", "data/registry/topologies/*.yaml", "providers/CONTRACTS.md", "LICENSE"]

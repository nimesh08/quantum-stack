# spinor/registry/chips/quantinuum_helios.yaml

id: quantinuum_helios
provider: azure

schema_version: 2
vendor: quantinuum
qir_platform: quantinuum-helios
readiness: needs_refresh
readiness_reason: "Live submission requires a discovered, concrete capability snapshot."
routes: [azure, quantinuum]
formats: [qir, qasm2]
parameter_units: radians
directed_connectivity: false
capability_verified: false
capability_provenance: historical_registry
qubits: 56
native_gates: [u1q, rzz]

coupling_map:
  topology: all_to_all
  size: 56

supports:
  mid_circuit_measure: true
  feedforward: full
  reset: true

calibration:
  source: azure_api
  refresh: nightly
  store: ~/.cache/spinor/calibration/quantinuum_helios.json

decomposition:
  one_qubit:
    recipe: euler_zyz
    rotation_gate: u1q
    pi_2_gate: ""
  two_qubit:
    recipe: kak
    entangler: rzz
    entangler_count_max: 3

pricing:
  per_shot_usd: 0.05

notes: |
  Quantinuum Helios: 56-qubit trapped-ion, full feedforward
  capability. Adaptive-profile QIR target.
  source: https://www.quantinuum.com/products-solutions/quantinuum-systems/helios
  verified-upstream: 2026-06-16

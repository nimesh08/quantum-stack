# spinor/registry/chips/ibm_heron_r2.yaml

id: ibm_heron_r2
provider: ibm

schema_version: 2
vendor: ibm
readiness: family
readiness_reason: "Architecture family; select a concrete discovered backend."
routes: [ibm]
formats: [qasm3]
parameter_units: radians
directed_connectivity: false
capability_verified: false
capability_provenance: historical_registry
connectivity_provenance: synthetic_offline_fixture
qubits: 156
native_gates: [cz, rz, sx, x]

coupling_map:
  topology: heavy_hex_156
  size: 156

supports:
  mid_circuit_measure: true
  feedforward: limited
  reset: true

calibration:
  source: ibm_runtime_api
  refresh: nightly
  store: ~/.cache/spinor/calibration/ibm_heron_r2.json

decomposition:
  one_qubit:
    recipe: euler_zyz
    rotation_gate: rz
    pi_2_gate: sx
  two_qubit:
    recipe: kak
    entangler: cz
    entangler_count_max: 3

pricing:
  per_shot_usd: 0.00033

notes: |
  IBM Heron r2 family: 156 qubits, heavy-hex lattice with tunable
  couplers. CZ is the native two-qubit gate; rz is virtual. This is
  a family/compile-target entry. The physical devices on this
  family are ibm_kingston, ibm_fez, ibm_marrakesh — those have
  their own YAMLs for live submission.
  source: https://quantum.cloud.ibm.com/docs/en/guides/processor-types
  verified-upstream: 2026-06-27

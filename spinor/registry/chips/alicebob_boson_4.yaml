# spinor/registry/chips/alicebob_boson_4.yaml

id: alicebob_boson_4
provider: alicebob

schema_version: 2
vendor: alicebob
readiness: restricted
readiness_reason: "One physical cat qubit; nonuniversal x/z gate subset. Select a discovered Boson backend."
routes: [alicebob]
formats: [qir]
parameter_units: radians
directed_connectivity: false
capability_verified: false
capability_provenance: historical_registry
qubits: 1
native_gates: [x, z]

coupling_map:
  topology: linear_n
  size: 1

supports:
  mid_circuit_measure: true
  feedforward: limited
  reset: true

calibration:
  source: fixture
  refresh: fixture
  store: ~/.cache/spinor/calibration/alicebob_boson_4.json

decomposition:
  one_qubit:
    recipe: euler_zyz
    rotation_gate: rz
    pi_2_gate: ""
  two_qubit:
    recipe: kak
    entangler: ""
    entangler_count_max: 3

pricing:
  per_shot_usd: 0.0

notes: |
  Boson 4 is a device design, not a count of logical qubits. Felis exposes
  one physical cat qubit per QPU:1Q:BOSON_4A/4B/4C backend. Only x/z gates
  and supported preparation/measurement operations are available. Arbitrary
  algorithms requiring h, continuous rotations or entanglement are rejected.
  source: https://felis.alice-bob.com/docs/backends/backends_list/boson_4/

name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify artifacts without publishing anything"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Check companion versions and release tag
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          photon = tomllib.loads(Path('photon/bindings/python/pyproject.toml').read_text())['project']['version']
          providers = tomllib.loads(Path('spinor/submit/python/pyproject.toml').read_text())['project']['version']
          assert photon == providers, (photon, providers)
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + photon
          PY

  provider_distribution:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build twine
      - run: python -m build spinor/submit/python
      - run: python -m twine check spinor/submit/python/dist/*
      - run: python spinor/submit/python/tests/check_distribution.py spinor/submit/python/dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: provider-distribution
          path: spinor/submit/python/dist/*

  photon_wheels:
    needs: provider_distribution
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x86_64, arch: x86_64}
          - {os: ubuntu-24.04-arm, target: linux-arm64, arch: aarch64}
          - {os: macos-14, target: macos-arm64, arch: arm64}
          - {os: windows-2022, target: windows-x86_64, arch: AMD64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: provider-distribution
          path: wheelhouse-deps
      - name: Build and test each native wheel
        uses: pypa/cibuildwheel@v2
        with:
          package-dir: photon/bindings/python
          output-dir: dist
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: "cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_TEST: 'python "{project}/.github/scripts/install_release_dependencies.py" "{project}/wheelhouse-deps"'
          CIBW_TEST_COMMAND: 'python "{project}/photon/bindings/python/tests/installed_smoke.py"'
          CIBW_BEFORE_BUILD_WINDOWS: python -m pip install delvewheel==1.13.1
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: 'delvewheel repair --analyze-existing-exes -w {dest_dir} {wheel}'
      - uses: actions/upload-artifact@v4
        with:
          name: photon-wheels-${{ matrix.target }}
          path: dist/*.whl

  cli_archives:
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x86_64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
          - {os: macos-14, target: macos-arm64}
          - {os: windows-2022, target: windows-x86_64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install "cmake>=3.28" ninja
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQSTACK_ENABLE_TESTS=OFF
      - run: cmake --build build --config Release --parallel 2
      - run: python .github/scripts/package_cli.py --target ${{ matrix.target }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the platform archive
        shell: bash
        run: |
          for archive in dist/*.zip; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  publish_github_release:
    needs: [tests, photon_wheels, provider_distribution, cli_archives]
    if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
          pattern: photon-wheels-*
      - uses: actions/download-artifact@v4
        with:
          path: release
          name: provider-distribution
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
          pattern: cli-*
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  publish_pypi:
    needs: [tests, photon_wheels, provider_distribution]
    if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/heisenberg-photon
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: photon-wheels-*
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: provider-distribution
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

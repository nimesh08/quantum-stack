name: compiler-and-provider-tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: C++ and Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use the configured Python for native CLI execution
        run: >-
          python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('QSTACK_PYTHON='+sys.executable+'\n')"
      - name: Install build and test dependencies
        run: python -m pip install "cmake>=3.28" ninja "nanobind==2.12.0" pytest "./spinor/submit/python[test,qir]"
      - name: Configure compiler
        run: >-
          python -c "import nanobind, subprocess, sys; subprocess.run(['cmake', '-S', '.', '-B', 'build', '-DCMAKE_BUILD_TYPE=Release', '-DQSTACK_ENABLE_TESTS=ON', '-Dnanobind_DIR='+nanobind.cmake_dir(), '-DPython_EXECUTABLE='+sys.executable], check=True)"
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Compiler and frontend tests
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2
      - name: Provider contracts and runtime tests
        run: python -m pytest spinor/submit/python/tests -q
      - name: Keep test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-test-logs-${{ matrix.os }}
          path: build/Testing/Temporary/*.log

  optional_sdk:
    name: Real SDK contract (${{ matrix.provider }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        provider: [ibm, google, aws, azure, quantinuum, rigetti, iqm, oqc, aqt]
    env:
      QSTACK_TEST_SDK: ${{ matrix.provider }}
      AWS_EC2_METADATA_DISABLED: "true"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned provider extra in isolation
        run: python -m pip install "./spinor/submit/python[test,${{ matrix.provider }}]"
      - name: Validate real SDK serialization and offline transport contracts
        run: >-
          python -m pytest -q -ra
          spinor/submit/python/tests/test_sdk_contracts.py
          spinor/submit/python/tests/test_sdk_specialized_contracts.py
          spinor/submit/python/tests/test_provider_contracts.py

  package:
    name: Isolated provider package install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build source archive and wheel from that archive
        run: python -m build spinor/submit/python
      - name: Validate distribution metadata
        run: python -m twine check spinor/submit/python/dist/*
      - name: Verify installed registry outside the source checkout
        shell: bash
        run: python spinor/submit/python/tests/check_distribution.py spinor/submit/python/dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: provider-distributions
          path: spinor/submit/python/dist/*
